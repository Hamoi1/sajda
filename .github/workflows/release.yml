name: Release

# Push a version tag to release:
#   npm run version:set -- 2.1.0   (then commit)
#   git tag v2.1.0 && git push origin main v2.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sajda ${{ github.ref_name }}
          releaseBody: Building...
          # Stays a draft until every platform is uploaded; the publish job releases it.
          releaseDraft: true
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checksums
        run: |
          mkdir dl
          gh release download "$TAG" --dir dl --pattern "*.exe" --pattern "*.msi" --pattern "*.dmg"
          (cd dl && sha256sum * > ../SHA256SUMS.txt)
          gh release upload "$TAG" SHA256SUMS.txt --clobber

      - name: Notes and publish
        run: |
          prev=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -vx "$TAG" | head -1 || true)
          range=${prev:+$prev..}$TAG
          changes=$(git log "$range" --no-merges --format='%s' \
            | grep -E '^(feat|fix|perf)(\(.+\))?!?:' \
            | sed -E 's/^[a-z]+(\(.+\))?!?: */- /' || true)
          v=${TAG#v}
          {
            echo "## Download"
            echo
            echo "| System | File |"
            echo "| --- | --- |"
            echo "| Windows | \`Sajda_${v}_x64-setup.exe\` |"
            echo "| macOS (Apple Silicon) | \`Sajda_${v}_aarch64.dmg\` |"
            echo "| macOS (Intel) | \`Sajda_${v}_x64.dmg\` |"
            echo
            echo "Not code-signed yet. Windows: click **More info → Run anyway**. macOS: right-click the app and choose **Open** the first time."
            if [ -n "$changes" ]; then
              echo
              echo "## Changes"
              echo
              echo "$changes"
            fi
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest
