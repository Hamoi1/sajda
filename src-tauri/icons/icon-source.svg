  <!-- doorway -->
  <path d="M506 602 V578 a14 14 0 0 1 28 0 V602 Z" fill="#3D4B8F"/>
  <text x="512" y="846" text-anchor="middle" font-family="Segoe UI, Poppins, Arial, sans-serif" font-weight="600" font-size="178" fill="#FFFFFF" letter-spacing="2">Sajda</text>
</svg>
