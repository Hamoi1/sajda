<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Sajda app icon, redrawn from the owner's reference image. Regenerate the set with:
       npx tauri icon src-tauri/icons/icon-source.svg  (then see icons/README.md for small sizes) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F8FC6"/>
      <stop offset="0.55" stop-color="#4A5A9E"/>
      <stop offset="1" stop-color="#303A7C"/>
