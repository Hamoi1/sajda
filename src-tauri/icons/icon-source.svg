    <rect x="398" y="480" width="32" height="8"/>
    <path d="M402 434 L414 402 L426 434 Z"/>
    <rect x="412" y="384" width="4" height="18"/>
    <!-- dome and hall -->
    <path d="M456 548 C456 494 498 474 520 442 C542 474 584 494 584 548 Z"/>
    <rect x="518" y="414" width="4" height="30"/>
    <rect x="440" y="546" width="160" height="56"/>
  </g>
  <!-- crescent finials -->
  <g fill="url(#gold)">
    <path d="M623 184 a12 12 0 1 0 10 18 a9 9 0 1 1 -10 -18 Z"/>
    <path d="M414 368 a11 11 0 1 0 9 16 a8 8 0 1 1 -9 -16 Z"/>
    <path d="M520 398 a12 12 0 1 0 10 18 a9 9 0 1 1 -10 -18 Z"/>
