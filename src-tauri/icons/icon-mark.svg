<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Small-size variant of icon-source.svg: the mark only, enlarged, because the
       "Sajda" wordmark is unreadable at 16-32 px (tray icon, taskbar, .ico). -->
