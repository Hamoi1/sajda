      <rect x="404" y="432" width="20" height="168"/>
      <rect x="398" y="480" width="32" height="8"/>
      <path d="M402 434 L414 402 L426 434 Z"/>
      <path d="M456 548 C456 494 498 474 520 442 C542 474 584 494 584 548 Z"/>
