      <stop offset="1" stop-color="#303A7C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4E4C4"/>
      <stop offset="1" stop-color="#CDA972"/>
    </linearGradient>
    <mask id="crescent">
